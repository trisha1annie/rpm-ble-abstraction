name: "BleModuleA"
displayName: "YK Oximeter"

notification:
  enabled: true
  rate_hz: 5
  characteristic: "oxi"
  values: [98, 75]
  faults:
    jitter_ms: 0
    jitter_start_after_ms: 20000
    dropout_start_after_ms: 15000
    dropout_duration_ms: 500


services:
  - uuid: "cdeacd80-5235-4c07-8846-93a37ee6b86d"
    characteristics:
      - uuid: "cdeacd81-5235-4c07-8846-93a37ee6b86d"
        name: "oxi"
        properties: ["notify", "read"]
        encoder:
          type: "pulse-oximeter"

  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    characteristics:
      - uuid: "00002a23-0000-1000-8000-00805f9b34fb"
        name: "system-id"
        properties: ["read"]
        initial: "BleModuleA"
        encoder:
          type: "text"
